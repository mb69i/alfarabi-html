<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Alfarabi University AI Engineering</title>
  <meta name="description" content="Read the latest news and announcements from Al-Farabi University AI Engineering Department.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/article.css">
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="navbar-root"></div>

  <div class="article-page">
    <!-- Loading State -->
    <div class="article-loading" id="article-loading">
      <div class="article-loading-spinner"></div>
      <p>Loading article...</p>
    </div>

    <!-- Error State -->
    <div class="article-error" id="article-error" style="display:none">
      <div class="container">
        <div class="article-error-inner glass-card">
          <span class="article-error-icon">📰</span>
          <h2 id="article-error-title">Article Not Found</h2>
          <p id="article-error-desc">This article may have been removed or the link is incorrect.</p>
          <a href="news.html" class="btn-gold" id="article-back-err">← Back to News</a>
        </div>
      </div>
    </div>

    <!-- Article Content -->
    <article class="article-content" id="article-content" style="display:none">
      <!-- Hero Image -->
      <div class="article-hero" id="article-hero"></div>

      <div class="container article-layout">
        <!-- Breadcrumb -->
        <nav class="article-breadcrumb" aria-label="Breadcrumb">
          <a href="index.html" id="art-bc-home"></a>
          <span>/</span>
          <a href="news.html" id="art-bc-news"></a>
          <span>/</span>
          <span id="art-bc-title"></span>
        </nav>

        <div class="article-grid">
          <!-- Main Content -->
          <div class="article-main">
            <!-- Category + Date -->
            <div class="article-meta-top" id="article-meta-top"></div>

            <!-- Title -->
            <h1 class="article-title" id="article-title"></h1>

            <!-- Author + Date row -->
            <div class="article-byline" id="article-byline"></div>

            <div class="article-divider"></div>

            <!-- Body -->
            <div class="article-body" id="article-body"></div>

            <div class="article-divider"></div>

            <!-- Back + Share -->
            <div class="article-actions">
              <a href="news.html" class="btn-gold article-back-btn" id="article-back">← Back to News</a>
              <div class="article-share">
                <span class="article-share-label">Share:</span>
                <!-- WhatsApp -->
                <a class="article-share-btn article-share-whatsapp" id="share-whatsapp" target="_blank" rel="noopener" title="Share on WhatsApp" aria-label="Share on WhatsApp">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                </a>
                <!-- Twitter/X -->
                <a class="article-share-btn article-share-twitter" id="share-twitter" target="_blank" rel="noopener" title="Share on X / Twitter" aria-label="Share on Twitter">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.261 5.635 5.903-5.635zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <!-- LinkedIn -->
                <a class="article-share-btn article-share-linkedin" id="share-linkedin" target="_blank" rel="noopener" title="Share on LinkedIn" aria-label="Share on LinkedIn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </a>
                <!-- Copy link -->
                <button class="article-share-btn" id="share-copy" title="Copy link" aria-label="Copy article link">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <aside class="article-sidebar">
            <div class="article-sidebar-card glass-card">
              <div class="article-sidebar-title" id="sidebar-related-title">More Articles</div>
              <div class="article-related-list" id="article-related"></div>
            </div>

            <div class="article-sidebar-card glass-card" id="sidebar-event-info" style="display:none">
              <div class="article-sidebar-title">Event Details</div>
              <div class="article-event-details" id="article-event-details"></div>
            </div>
          </aside>
        </div>
      </div>
    </article>
  </div>

  <div id="footer-root"></div>

  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initPage();

      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      // Translate static elements
      document.getElementById('art-bc-home').textContent = t('common.home');
      document.getElementById('art-bc-news').textContent = t('nav.news');
      document.getElementById('article-back').textContent = '← ' + t('nav.news');
      document.getElementById('article-back-err').textContent = '← ' + t('nav.news');

      if (!articleId) {
        showError('No Article Specified', 'Please navigate here from the News page.');
        return;
      }

      try {
        const articles = (await getArticles()) || [];
        const article = articles.find(a => String(a.id) === String(articleId));

        if (!article || article.status !== 'published') {
          showError('Article Not Found', 'This article may have been removed or the link is incorrect.');
          return;
        }

        // Update page title & meta
        document.title = article.title + ' — Alfarabi University';
        document.querySelector('meta[name="description"]').content = article.summary || '';

        // Breadcrumb truncated title
        const shortTitle = article.title.length > 40 ? article.title.slice(0, 40) + '…' : article.title;
        document.getElementById('art-bc-title').textContent = shortTitle;

        // Hero image
        const heroEl = document.getElementById('article-hero');
        if (article.image_url) {
          heroEl.style.backgroundImage = `url('${article.image_url}')`;
          heroEl.classList.add('has-image');
        } else {
          heroEl.classList.add('no-image');
        }

        // Meta top (category badge + type)
        const catColors = { seminar: 'gold', exam: 'crimson', deadline: 'crimson', social: 'blue', lecture: 'gold', workshop: 'blue', other: 'gold', news: 'gold', event: 'crimson' };
        const typeLabel = article.type === 'news' ? t('news.type_news') : t('news.type_event');
        const tagClass = article.type === 'news' ? 'news-tag-gold' : 'news-tag-crimson';
        document.getElementById('article-meta-top').innerHTML = `
          <span class="news-tag ${tagClass}">${typeLabel}</span>
          ${article.category ? `<span class="article-category-badge">${article.category}</span>` : ''}
          <span class="article-date-badge">${new Date(article.published_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })}</span>
        `;

        // Title
        document.getElementById('article-title').textContent = article.title;

        // Byline
        document.getElementById('article-byline').innerHTML = `
          <div class="article-author">
            <div class="article-author-avatar">${(article.author || 'D').charAt(0)}</div>
            <div>
              <div class="article-author-name">${article.author || 'Department'}</div>
              <div class="article-author-role">Alfarabi University</div>
            </div>
          </div>
          <div class="article-read-time">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${estimateReadTime(article.content || article.summary || '')} min read
          </div>
        `;

        // Body — content or summary fallback
        const bodyEl = document.getElementById('article-body');
        if (article.content) {
          bodyEl.innerHTML = formatContent(article.content);
        } else if (article.summary) {
          bodyEl.innerHTML = `<p class="article-summary-only">${article.summary}</p>
          <p class="article-no-content-note">Full article content has not been published yet.</p>`;
        } else {
          bodyEl.innerHTML = '<p class="article-no-content-note">No content available for this article.</p>';
        }

        // Event details sidebar card
        if (article.type === 'event' && (article.event_date || article.location || article.time)) {
          document.getElementById('sidebar-event-info').style.display = '';
          const evDate = article.event_date ? new Date(article.event_date).toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) : null;
          document.getElementById('article-event-details').innerHTML = [
            evDate ? `<div class="article-event-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${evDate}</span></div>` : '',
            article.time ? `<div class="article-event-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>${article.time}</span></div>` : '',
            article.location ? `<div class="article-event-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>${article.location}</span></div>` : '',
          ].filter(Boolean).join('');
        }

        // Related articles sidebar
        const related = articles
          .filter(a => a.status === 'published' && String(a.id) !== String(articleId))
          .sort((a, b) => new Date(b.published_at) - new Date(a.published_at))
          .slice(0, 4);
        const relatedEl = document.getElementById('article-related');
        if (related.length === 0) {
          relatedEl.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;padding:8px 0">No other articles yet.</p>';
        } else {
          relatedEl.innerHTML = related.map(a => `
            <a href="article.html?id=${a.id}" class="article-related-item">
              ${a.image_url ? `<img src="${a.image_url}" loading="lazy" class="article-related-thumb" alt="${a.title}">` : `<div class="article-related-thumb-placeholder">${a.type === 'news' ? '📰' : '📅'}</div>`}
              <div>
                <div class="article-related-title">${a.title}</div>
                <div class="article-related-date">${new Date(a.published_at).toLocaleDateString()}</div>
              </div>
            </a>
          `).join('');
        }

        // Wire social share links dynamically
        const shareUrl  = encodeURIComponent(window.location.href);
        const shareText = encodeURIComponent(article.title + ' — Alfarabi University');
        document.getElementById('share-whatsapp').href = `https://wa.me/?text=${shareText}%20${shareUrl}`;
        document.getElementById('share-twitter').href  = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`;
        document.getElementById('share-linkedin').href = `https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}`;

        // Copy-link button
        document.getElementById('share-copy').addEventListener('click', async () => {
          const url = window.location.href;
          try {
            await navigator.clipboard.writeText(url);
            const btn = document.getElementById('share-copy');
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
            btn.style.color = 'var(--gold)';
            setTimeout(() => {
              btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>';
              btn.style.color = '';
            }, 2000);
          } catch {}
        });

        // Show content, hide loading
        document.getElementById('article-loading').style.display = 'none';
        document.getElementById('article-content').style.display = '';
        initAnimateOnScroll();
      } catch (err) {
        showError('Error Loading Article', 'Something went wrong. Please try again.');
      }

      function showError(title, desc) {
        document.getElementById('article-loading').style.display = 'none';
        document.getElementById('article-error').style.display = '';
        document.getElementById('article-error-title').textContent = title;
        document.getElementById('article-error-desc').textContent = desc;
      }

      function estimateReadTime(text) {
        const words = text.trim().split(/\s+/).length;
        return Math.max(1, Math.ceil(words / 200));
      }

      function formatContent(content) {
        // Basic paragraph formatting: split by double newlines
        return content
          .split(/\n\n+/)
          .filter(p => p.trim())
          .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
          .join('');
      }
    });
  </script>
</body>
</html>
