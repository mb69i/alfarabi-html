<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Announcements — Alfarabi University AI Engineering</title>
  <meta name="description" content="Stay up to date with the latest research breakthroughs, campus events, and department announcements.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="News &amp; Announcements — Alfarabi University">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="/og-image.png">
  <meta property="og:description" content="Latest research, campus events, and department announcements from Al-Farabi University AI Engineering.">
  <meta property="og:url" content="https://alfarabi.edu.iq/news.html">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://alfarabi.edu.iq/news.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/news.css">
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="navbar-root"></div>

  <div style="min-height:100vh;padding-top:var(--nav-height)">
    <section style="position:relative;padding:48px 0;overflow:hidden;border-bottom:1px solid var(--glass-border)">
      <div style="position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 85% 20%,rgba(165,28,48,0.07) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 10% 90%,rgba(212,175,55,0.05) 0%,transparent 55%)" aria-hidden="true"></div>
      <div class="container" style="position:relative;z-index:1">
        <div style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text-muted);margin-bottom:24px">
          <a href="index.html" style="color:var(--text-muted);text-decoration:none" id="nw-bc-home"></a><span>/</span><span id="nw-bc-current"></span>
        </div>
        <div class="section-label animate-fade-in-up" style="animation-delay:100ms;opacity:0" id="nw-label"></div>
        <h1 class="animate-fade-in-up" style="animation-delay:200ms;opacity:0;font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1.15;margin-top:8px" id="nw-title"></h1>
        <p class="animate-fade-in-up" style="animation-delay:350ms;opacity:0;margin-top:14px;color:var(--text-secondary);font-size:1rem;max-width:640px" id="nw-sub"></p>
      </div>
    </section>

    <section class="news-section" style="padding-top:40px">
      <div class="container"><div id="nw-list"></div></div>
    </section>
  </div>

  <div id="footer-root"></div>

  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initPage();
      renderSkeleton('#nw-list', 'news', 6);
      const articles = (await getArticles()) || [];

      document.getElementById('nw-bc-home').textContent = t('common.home');
      document.getElementById('nw-bc-current').textContent = t('nav.news');
      document.getElementById('nw-label').textContent = t('news.page_label');
      document.getElementById('nw-title').innerHTML = t('news.page_title_1') + ' <span class="text-gradient-gold">' + t('news.page_title_2') + '</span>';
      document.getElementById('nw-sub').textContent = t('news.page_subtitle');

      const published = articles.filter(a => a.status === 'published').sort((a,b) => new Date(b.published_at) - new Date(a.published_at));

      if (published.length === 0) {
        document.getElementById('nw-list').innerHTML = `<div class="glass-card" style="padding:60px 40px;text-align:center"><p style="color:var(--text-muted);font-size:0.95rem">${t('news.no_articles')}</p></div>`;
        return;
      }

      let html = '<div style="display:flex;flex-direction:column;gap:20px">';
      published.forEach((a, i) => {
        const tagClass = a.type === 'news' ? 'news-tag-gold' : 'news-tag-crimson';
        const tagLabel = a.type === 'news' ? t('news.type_news') : t('news.type_event');
        html += `<div class="news-card glass-card aos-up" data-aos-delay="${i*60}">
          ${a.image_url ? `<img src="${a.image_url}" loading="lazy" class="news-card-img" alt="${a.title}">` : ''}
          <div class="news-card-top"><span class="news-tag ${tagClass}">${tagLabel}</span><span class="news-date">${new Date(a.published_at).toLocaleDateString()}</span></div>
          <h3 class="news-card-title" style="font-size:1.1rem;font-family:var(--font-serif)">${a.title}</h3>
          <p class="news-card-excerpt" style="-webkit-line-clamp:3">${a.summary}</p>
          <div class="news-card-footer">
            <span class="news-read-time">By ${a.author || 'Department'}</span>
            <a href="article.html?id=${a.id}" class="news-read-more">${t('news.read_more')}</a>
          </div>
        </div>`;
      });
      html += '</div>';
      document.getElementById('nw-list').innerHTML = html;

      initAnimateOnScroll();
    });
  </script>
</body>
</html>
